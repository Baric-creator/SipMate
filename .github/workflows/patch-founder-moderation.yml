name: Patch Founder Moderation

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch-founder-moderation:
    if: github.event.head_commit.message != 'Add founder moderation queue'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch founder dashboard
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('website/founder.html')
          s = p.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'Missing anchor: {label}')
              s = s.replace(old, new, 1)

          replace_once(
              '<button class="tab" data-tab="community">Community</button>\n        <button class="tab" data-tab="system">System</button>',
              '<button class="tab" data-tab="community">Community</button>\n        <button class="tab" data-tab="moderation">Moderation</button>\n        <button class="tab" data-tab="system">System</button>',
              'moderation tab'
          )

          css = '''\n    .moderation-head{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}.moderation-filters{display:flex;gap:8px;flex-wrap:wrap}.mod-filter{border:1px solid #34343a;background:#111113;color:#999;border-radius:999px;padding:9px 12px;font:800 11px Inter;cursor:pointer}.mod-filter.active{border-color:#ff3b30;color:#fff;background:#25110f}.mod-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.mod-summary .stat{margin:0}.moderation-list{display:grid;gap:12px}.report-card{border:1px solid #2d2d32;background:#0f0f11;border-radius:18px;padding:16px}.report-card.pending{border-color:#5a3c1e}.report-card.reviewed{border-color:#254d35}.report-card.dismissed{opacity:.82}.report-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.report-people{display:grid;gap:5px}.report-people b{font-size:14px}.report-people small{color:#777}.report-reason{margin:12px 0 6px;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.8px;color:#ff9a72}.report-details{color:#bbb;font-size:12px;line-height:1.55;white-space:pre-wrap}.report-meta{color:#6f6f77;font-size:10px;margin-top:10px}.report-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.mod-action{border:1px solid #39393f;background:#171719;color:#ddd;border-radius:11px;padding:9px 11px;font:800 11px Inter;cursor:pointer}.mod-action.review{border-color:#285a3b;color:#67dc98}.mod-action.dismiss{border-color:#57401f;color:#e2b16a}.mod-action.reopen{border-color:#4a4a52;color:#bbb}@media(max-width:640px){.mod-summary{grid-template-columns:1fr}.report-top{flex-direction:column}}\n'''
          replace_once('  </style>', css + '  </style>', 'moderation styles')

          moderation_section = '''\n      <section class="section" data-section="moderation">\n        <article class="card">\n          <div class="moderation-head"><div><p class="eyebrow">TRUST & SAFETY</p><h2 style="font-size:30px;margin-top:8px">Moderation queue</h2><p class="muted">Review user reports and keep an auditable moderation trail.</p></div><button class="btn secondary" id="refreshModeration" type="button">Refresh reports</button></div>\n          <div class="mod-summary"><article class="stat"><small>Pending</small><strong id="modPending">—</strong><span>Needs action</span></article><article class="stat"><small>Reviewed</small><strong id="modReviewed">—</strong><span>Actioned reports</span></article><article class="stat"><small>Dismissed</small><strong id="modDismissed">—</strong><span>Closed without action</span></article></div>\n          <div class="moderation-filters"><button class="mod-filter active" data-mod-filter="pending" type="button">Pending</button><button class="mod-filter" data-mod-filter="reviewed" type="button">Reviewed</button><button class="mod-filter" data-mod-filter="dismissed" type="button">Dismissed</button><button class="mod-filter" data-mod-filter="all" type="button">All</button></div>\n          <div id="moderationMsg" class="msg"></div>\n          <div id="moderationList" class="moderation-list"><div class="report-card"><span class="muted">Loading reports…</span></div></div>\n        </article>\n      </section>\n\n'''
          replace_once('      <section class="section" data-section="system">', moderation_section + '      <section class="section" data-section="system">', 'moderation section')

          replace_once(
              '  const LAUNCH_ENDPOINT=`${SUPABASE_URL}/functions/v1/admin-launch-config`;',
              '  const LAUNCH_ENDPOINT=`${SUPABASE_URL}/functions/v1/admin-launch-config`;\n  const MODERATION_ENDPOINT=`${SUPABASE_URL}/functions/v1/admin-moderation`;',
              'moderation endpoint'
          )

          moderation_js = r'''\n  let moderationRows=[];\n  let moderationFilter='pending';\n  function personLabel(p){const name=p?.name||'Unknown user';const extras=[p?.age,p?.city].filter(Boolean).join(' · ');return `${esc(name)}${extras?` <small>${esc(extras)}</small>`:''}`}\n  function renderModeration(){\n    const list=document.getElementById('moderationList');\n    const rows=moderationFilter==='all'?moderationRows:moderationRows.filter(x=>x.status===moderationFilter);\n    list.innerHTML=rows.length?rows.map(x=>{\n      const actions=x.status==='pending'\n        ? `<button class="mod-action review" data-report-action="reviewed" data-report-id="${esc(x.id)}">Mark reviewed</button><button class="mod-action dismiss" data-report-action="dismissed" data-report-id="${esc(x.id)}">Dismiss</button>`\n        : `<button class="mod-action reopen" data-report-action="pending" data-report-id="${esc(x.id)}">Reopen</button>`;\n      return `<div class="report-card ${esc(x.status)}"><div class="report-top"><div class="report-people"><b>Reported: ${personLabel(x.reported)}</b><small>Reporter: ${personLabel(x.reporter)}</small></div><span class="tag ${x.status==='reviewed'?'ok':x.status==='pending'?'warn':''}">${esc(String(x.status||'').toUpperCase())}</span></div><div class="report-reason">${esc(String(x.reason||'').replaceAll('_',' '))}</div>${x.details?`<div class="report-details">${esc(x.details)}</div>`:''}<div class="report-meta">Created ${x.created_at?new Date(x.created_at).toLocaleString():'—'}${x.reviewed_at?` · handled ${new Date(x.reviewed_at).toLocaleString()}`:''}</div><div class="report-actions">${actions}</div></div>`;\n    }).join(''):'<div class="report-card"><span class="muted">No reports in this view. 🍻</span></div>';\n  }\n  async function loadModeration(){\n    const el=document.getElementById('moderationMsg');\n    try{const h=await headers();const r=await fetch(MODERATION_ENDPOINT,{headers:h,cache:'no-store'});const d=await r.json();if(!r.ok||d?.ok!==true)throw new Error(d?.error||'request_failed');moderationRows=d.reports||[];document.getElementById('modPending').textContent=safe(d.counts?.pending,0);document.getElementById('modReviewed').textContent=safe(d.counts?.reviewed,0);document.getElementById('modDismissed').textContent=safe(d.counts?.dismissed,0);renderModeration();msg(el,'')}catch(e){msg(el,`Moderation error: ${e.message}`,'err')}\n  }\n  async function setReportStatus(id,status){\n    const el=document.getElementById('moderationMsg');msg(el,'Saving…');\n    try{const h=await headers();const r=await fetch(MODERATION_ENDPOINT,{method:'PATCH',headers:h,body:JSON.stringify({report_id:id,status})});const d=await r.json();if(!r.ok||d?.ok!==true)throw new Error(d?.error||'request_failed');msg(el,'Saved.','ok');await Promise.all([loadModeration(),loadStatus()])}catch(e){msg(el,`Save failed: ${e.message}`,'err')}\n  }\n'''
          replace_once('  async function loadAll(){await Promise.all([loadStatus(),loadLaunch()])}', moderation_js + '\n  async function loadAll(){await Promise.all([loadStatus(),loadLaunch(),loadModeration()])}', 'moderation JS')

          replace_once(
              "  document.getElementById('refreshAll').addEventListener('click',loadAll);document.getElementById('refreshLaunch').addEventListener('click',loadLaunch);document.querySelectorAll('[data-phase]').forEach(btn=>btn.addEventListener('click',()=>setPhase(btn.dataset.phase)));",
              "  document.getElementById('refreshAll').addEventListener('click',loadAll);document.getElementById('refreshLaunch').addEventListener('click',loadLaunch);document.getElementById('refreshModeration').addEventListener('click',loadModeration);document.querySelectorAll('[data-phase]').forEach(btn=>btn.addEventListener('click',()=>setPhase(btn.dataset.phase)));document.querySelectorAll('[data-mod-filter]').forEach(btn=>btn.addEventListener('click',()=>{moderationFilter=btn.dataset.modFilter;document.querySelectorAll('[data-mod-filter]').forEach(x=>x.classList.toggle('active',x===btn));renderModeration()}));document.getElementById('moderationList').addEventListener('click',e=>{const btn=e.target.closest('[data-report-action]');if(btn)setReportStatus(btn.dataset.reportId,btn.dataset.reportAction)});",
              'moderation events'
          )

          p.write_text(s, encoding='utf-8', newline='\n')
          PY
      - name: Basic verification
        run: |
          grep -q 'data-tab="moderation"' website/founder.html
          grep -q 'admin-moderation' website/founder.html
          grep -q 'data-report-action' website/founder.html
      - name: Commit patch
        run: |
          git config user.name 'Baric-creator'
          git config user.email 'baric5555baric@gmail.com'
          git add website/founder.html
          git commit -m 'Add founder moderation queue'
          git push origin master
