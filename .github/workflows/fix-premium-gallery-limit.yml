name: Fix Premium Gallery Limit

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fix-premium-gallery-limit.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch app and translations
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const editPath = 'src/app/edit-profile.tsx';
          let edit = fs.readFileSync(editPath, 'utf8');
          const oldGuard = 'if (profilePhotos.length >= 6) {';
          const newGuard = 'if (profilePhotos.length >= 10) {';
          if (!edit.includes(oldGuard) && !edit.includes(newGuard)) {
            throw new Error('Gallery limit guard not found in edit-profile.tsx');
          }
          edit = edit.replace(oldGuard, newGuard);
          fs.writeFileSync(editPath, edit);

          const i18nPath = 'src/lib/i18n.ts';
          let i18n = fs.readFileSync(i18nPath, 'utf8');
          const replacements = [
            ['Premium allows up to 6 gallery photos.', 'Premium allows up to 10 gallery photos.'],
            ['Premium erlaubt bis zu 6 Galeriefotos.', 'Premium erlaubt bis zu 10 Galeriefotos.'],
            ['Premium omogućuje najviše 6 fotografija u galeriji.', 'Premium omogućuje najviše 10 fotografija u galeriji.'],
          ];
          for (const [from, to] of replacements) {
            if (!i18n.includes(from) && !i18n.includes(to)) {
              throw new Error(`Translation not found: ${from}`);
            }
            i18n = i18n.replace(from, to);
          }
          fs.writeFileSync(i18nPath, i18n);
          NODE

      - name: Remove one-shot workflow
        run: rm .github/workflows/fix-premium-gallery-limit.yml

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/edit-profile.tsx src/lib/i18n.ts .github/workflows/fix-premium-gallery-limit.yml
          git commit -m "fix: allow 10 Premium gallery photos"
          git push origin master
