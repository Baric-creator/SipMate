name: Encoding Audit

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  encoding-audit:
    if: github.event.head_commit.message != 'Remove one-time encoding audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan source text for invalid UTF-8 and mojibake
        run: |
          python - <<'PY'
          from pathlib import Path
          roots = [Path('src'), Path('website'), Path('docs')]
          bad = ('Ã','Â','â€','âœ','ðŸ','ï¸','â†','â—','âš','â˜')
          hits=[]
          read_errors=[]
          for root in roots:
              if not root.exists():
                  continue
              for p in root.rglob('*'):
                  if not p.is_file() or p.suffix.lower() not in {'.ts','.tsx','.js','.mjs','.html','.css','.md','.json','.txt'}:
                      continue
                  try:
                      text=p.read_text(encoding='utf-8')
                  except Exception as e:
                      read_errors.append((str(p), str(e)))
                      continue
                  for i,line in enumerate(text.splitlines(),1):
                      if any(token in line for token in bad):
                          hits.append((str(p),i,line.strip()))
          if read_errors:
              print('INVALID_UTF8')
              for p,e in read_errors: print(f'{p}: {e}')
          if hits:
              print('MOJIBAKE_CANDIDATES')
              for p,i,line in hits:
                  print(f'{p}:{i}: {line[:300]}')
          if read_errors or hits:
              raise SystemExit(2)
          print('Encoding audit clean: all scanned text is valid UTF-8 with no common mojibake patterns.')
          PY
