name: Patch Nearby Realtime Closure

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Keep Nearby realtime refresh on current filters'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Nearby realtime closure
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/app/nearby.tsx')
          s=p.read_text(encoding='utf-8')
          old="""    return () => {\n      supabase.removeChannel(\n        channel\n      );\n    };\n  }, []);\n\n  async function handleSkipProfile(\n"""
          new="""    return () => {\n      supabase.removeChannel(\n        channel\n      );\n    };\n  }, [\n    maxDistance,\n    drinkFilter,\n    ageFilter,\n    genderFilter,\n    customLatitude,\n    customLongitude,\n  ]);\n\n  async function handleSkipProfile(\n"""
          if old not in s:
              raise SystemExit('Nearby realtime dependency anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8',newline='\n')
          PY
      - name: Verify checks
        run: |
          npm ci
          npm run check
          npm run release:audit
      - name: Commit patch
        run: |
          git config user.name 'Baric-creator'
          git config user.email 'baric5555baric@gmail.com'
          git add src/app/nearby.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Keep Nearby realtime refresh on current filters'
          git push origin master
