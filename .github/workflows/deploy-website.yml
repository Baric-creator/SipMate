name: Deploy SipMate website

on:
  push:
    branches: [master]
    paths:
      - 'website/**'
      - 'scripts/website-audit.mjs'
      - 'scripts/website-link-audit.mjs'
      - 'scripts/website-seo-legal-audit.mjs'
      - 'scripts/website-launch-copy-audit.mjs'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Validate website before deploy
        run: |
          node scripts/website-audit.mjs
          node scripts/website-link-audit.mjs
          node scripts/website-seo-legal-audit.mjs
          node scripts/website-launch-copy-audit.mjs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
