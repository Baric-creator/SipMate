name: Patch Active Session Expiry

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Expire Nearby session live on Home'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expire active session live
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/index.tsx')
          s = p.read_text(encoding='utf-8')
          old = "  useEffect(() => {\n    if (!profile?.is_active || !profile.active_until) return;\n\n    const tick = () => setActiveClock(Date.now());\n    tick();\n    const timer = setInterval(tick, 30_000);\n    return () => clearInterval(timer);\n  }, [profile?.is_active, profile?.active_until]);\n"
          new = "  useEffect(() => {\n    if (!profile?.is_active || !profile.active_until) return;\n\n    const activeUntil = profile.active_until;\n    const expiresAt = new Date(activeUntil).getTime();\n    if (!Number.isFinite(expiresAt)) return;\n\n    const expireSession = () => {\n      setProfile((current) =>\n        current?.active_until === activeUntil\n          ? { ...current, is_active: false, active_until: null }\n          : current\n      );\n      void supabase\n        .from('profiles')\n        .update({ is_active: false, active_until: null, last_seen_at: null })\n        .eq('id', profile.id)\n        .eq('active_until', activeUntil);\n    };\n\n    const remainingMs = expiresAt - Date.now();\n    if (remainingMs <= 0) {\n      expireSession();\n      return;\n    }\n\n    setActiveClock(Date.now());\n    const clockTimer = setInterval(() => setActiveClock(Date.now()), 30_000);\n    const expiryTimer = setTimeout(expireSession, remainingMs);\n    return () => {\n      clearInterval(clockTimer);\n      clearTimeout(expiryTimer);\n    };\n  }, [profile?.id, profile?.is_active, profile?.active_until]);\n"
          if old not in s:
              raise SystemExit('active session effect anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8', newline='\n')
          PY
      - name: Verify checks
        run: |
          npm ci
          npm run check
          npm run release:audit
      - name: Commit patch
        run: |
          git config user.name 'Baric-creator'
          git config user.email 'baric5555baric@gmail.com'
          git add src/app/index.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Expire Nearby session live on Home'
          git push origin master
