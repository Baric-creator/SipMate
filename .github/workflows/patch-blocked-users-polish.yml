name: Patch Blocked Users Polish

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Polish blocked users freshness and avatars'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Polish blocked users screen
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/app/blocked-users.tsx')
          s=p.read_text(encoding='utf-8')

          s=s.replace("import { useRouter } from 'expo-router';", "import { useFocusEffect, useRouter } from 'expo-router';", 1)
          s=s.replace("import { useEffect, useState } from 'react';", "import { useCallback, useState } from 'react';", 1)

          type_anchor="""import { supabase } from '../lib/supabase';\n\nexport default function BlockedUsersScreen() {\n"""
          type_block="""import { supabase } from '../lib/supabase';\n\ntype BlockedProfile = {\n  id: string;\n  name: string | null;\n  age: number | null;\n  city: string | null;\n  avatar_url: string | null;\n};\n\nexport default function BlockedUsersScreen() {\n"""
          if type_anchor not in s:
              raise SystemExit('blocked users type anchor not found')
          s=s.replace(type_anchor,type_block,1)

          s=s.replace("""  const [blockedUsers, setBlockedUsers] =\n    useState<any[]>([]);\n""", """  const [blockedUsers, setBlockedUsers] =\n    useState<BlockedProfile[]>([]);\n""", 1)

          old_effect="""  useEffect(() => {\n    loadBlockedUsers();\n  }, []);\n"""
          new_effect="""  useFocusEffect(\n    useCallback(() => {\n      void loadBlockedUsers();\n    }, [])\n  );\n"""
          if old_effect not in s:
              raise SystemExit('blocked users initial effect not found')
          s=s.replace(old_effect,new_effect,1)

          old_card="""                <View\n                  style={styles.userInfo}\n                >\n                  <Text\n                    style={styles.userName}\n                  >\n"""
          new_card="""                {user.avatar_url ? (\n                  <Image source={{ uri: user.avatar_url }} style={styles.avatar} resizeMode=\"cover\" />\n                ) : (\n                  <View style={styles.avatarFallback}>\n                    <Text style={styles.avatarFallbackText}>\n                      {(user.name ?? 'S').charAt(0).toUpperCase()}\n                    </Text>\n                  </View>\n                )}\n\n                <View\n                  style={styles.userInfo}\n                >\n                  <Text\n                    style={styles.userName}\n                  >\n"""
          if old_card not in s:
              raise SystemExit('blocked user card anchor not found')
          s=s.replace(old_card,new_card,1)

          style_anchor="""  userInfo: {\n    flex: 1,\n    marginRight: 16,\n  },\n"""
          style_block="""  avatar: {\n    width: 46,\n    height: 46,\n    borderRadius: 23,\n    marginRight: 12,\n    backgroundColor: '#202024',\n  },\n\n  avatarFallback: {\n    width: 46,\n    height: 46,\n    borderRadius: 23,\n    marginRight: 12,\n    backgroundColor: '#211315',\n    borderWidth: 1,\n    borderColor: '#3A2020',\n    alignItems: 'center',\n    justifyContent: 'center',\n  },\n\n  avatarFallbackText: {\n    color: '#FFFFFF',\n    fontSize: 17,\n    fontWeight: '900',\n  },\n\n  userInfo: {\n    flex: 1,\n    marginRight: 16,\n  },\n"""
          if style_anchor not in s:
              raise SystemExit('blocked users style anchor not found')
          s=s.replace(style_anchor,style_block,1)

          s=s.replace("setBlockedUsers(profiles ?? []);", "setBlockedUsers((profiles ?? []) as BlockedProfile[]);", 1)
          p.write_text(s,encoding='utf-8',newline='\n')
          PY
      - name: Verify checks
        run: |
          npm ci
          npm run check
          npm run release:audit
      - name: Commit patch
        run: |
          git config user.name 'Baric-creator'
          git config user.email 'baric5555baric@gmail.com'
          git add src/app/blocked-users.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Polish blocked users freshness and avatars'
          git push origin master
