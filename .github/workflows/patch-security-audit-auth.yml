name: Patch Security Audit Auth

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Harden custom auth security audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden security audit for custom-auth functions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/security-audit.mjs')
          s=p.read_text(encoding='utf-8')

          old="""  assert(content.includes(\"Deno.env.get('APP_WEB_URL')\"), `${fn} does not anchor production redirects to APP_WEB_URL`);\n  assert(content.includes(\"parsed.hostname === 'localhost'\") || content.includes(\"parsed.hostname === '127.0.0.1'\"), `${fn} has no explicit local development-origin handling`);\n}"""
          new="""  assert(content.includes(\"Deno.env.get('APP_WEB_URL')\"), `${fn} does not anchor production redirects to APP_WEB_URL`);\n  assert(content.includes(\"parsed.hostname === 'localhost'\") || content.includes(\"parsed.hostname === '127.0.0.1'\"), `${fn} has no explicit local development-origin handling`);\n  assert(content.includes(\"req.headers.get('Authorization')\"), `${fn} no longer requires an Authorization header`);\n  assert(/\\.auth\\.getUser\\(\\)/.test(content), `${fn} no longer validates the caller with Supabase Auth`);\n}"""
          if old not in s:
              raise SystemExit('custom-auth function audit insertion point not found')
          s=s.replace(old,new)

          old2="""if (exists('supabase/config.toml')) {\n  const config = read('supabase/config.toml');\n  const manualJwtFunctions = [...config.matchAll(/\\[functions\\.([^\\]]+)\\][\\s\\S]*?verify_jwt\\s*=\\s*false/g)].map((match) => match[1]);\n  if (manualJwtFunctions.length) warn(`Functions with verify_jwt=false require their own authentication/signature checks: ${manualJwtFunctions.join(', ')}`);\n}"""
          new2="""if (exists('supabase/config.toml')) {\n  const config = read('supabase/config.toml');\n  const manualJwtFunctions = [...config.matchAll(/\\[functions\\.([^\\]]+)\\][\\s\\S]*?verify_jwt\\s*=\\s*false/g)].map((match) => match[1]);\n  const reviewedManualAuthFunctions = new Set(['create-checkout-session', 'create-customer-portal', 'stripe-webhook']);\n  const unreviewedManualAuthFunctions = manualJwtFunctions.filter((fn) => !reviewedManualAuthFunctions.has(fn));\n  assert(unreviewedManualAuthFunctions.length === 0, `Unreviewed verify_jwt=false function(s): ${unreviewedManualAuthFunctions.join(', ')}`);\n}"""
          if old2 not in s:
              raise SystemExit('verify_jwt audit block not found')
          s=s.replace(old2,new2)
          p.write_text(s,encoding='utf-8',newline='\n')
          PY
      - name: Verify checks
        run: |
          npm ci
          npm run check
          npm run release:audit
      - name: Commit patch
        run: |
          git config user.name 'Baric-creator'
          git config user.email 'baric5555baric@gmail.com'
          git add scripts/security-audit.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Harden custom auth security audit'
          git push origin master
