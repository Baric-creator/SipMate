name: Privacy RPC Migration Once

on:
  push:
    branches:
      - security-500m
    paths:
      - scripts/apply-privacy-rpc-migration.mjs
      - .github/workflows/privacy-migrate-once.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: security-500m
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply privacy RPC migration
        run: node scripts/apply-privacy-rpc-migration.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Commit migrated app screens
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/user-profile.tsx src/app/chat.tsx src/app/nearby.tsx
          git commit -m "Migrate profile discovery screens to privacy RPCs"
          git push origin HEAD:security-500m
