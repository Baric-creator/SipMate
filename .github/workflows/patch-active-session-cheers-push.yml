""" + anchor
          if anchor not in s:
              raise SystemExit('mutual query anchor not found')
          s = s.replace(anchor, addition, 1)
          profile.write_text(s, encoding='utf-8', newline='\n')

          config = Path('supabase/config.toml')
          s = config.read_text(encoding='utf-8')
          if '[functions.send-cheers-notification]' not in s:
              s += "\n\n[functions.send-cheers-notification]\nenabled = true\nverify_jwt = true\nentrypoint = \"./functions/send-cheers-notification/index.ts\"\n"
          config.write_text(s, encoding='utf-8', newline='\n')

          function_dir = Path('supabase/functions/send-cheers-notification')
          function_dir.mkdir(parents=True, exist_ok=True)
          function_code = '''import "jsr:@supabase/functions-js/edge-runtime.d.ts";
import { createClient } from "jsr:@supabase/supabase-js@2";

Deno.serve(async (req) => {
  const headers = { "Content-Type": "application/json" };
  if (req.method !== "POST") return new Response(JSON.stringify({ error: "method_not_allowed" }), { status: 405, headers });

  try {
    const authHeader = req.headers.get("Authorization");
    if (!authHeader) return new Response(JSON.stringify({ error: "unauthorized" }), { status: 401, headers });

    const supabaseUrl = Deno.env.get("SUPABASE_URL");
    const anonKey = Deno.env.get("SUPABASE_ANON_KEY");
    const serviceRole = Deno.env.get("SUPABASE_SERVICE_ROLE_KEY");
    if (!supabaseUrl || !anonKey || !serviceRole) return new Response(JSON.stringify({ error: "supabase_not_configured" }), { status: 500, headers });

    const callerClient = createClient(supabaseUrl, anonKey, {
      global: { headers: { Authorization: authHeader } },
      auth: { persistSession: false },
    });
    const token = authHeader.replace(/^Bearer\\s+/i, "");
    const { data: userData, error: userError } = await callerClient.auth.getUser(token);
    const caller = userData?.user;
    if (userError || !caller) return new Response(JSON.stringify({ error: "unauthorized" }), { status: 401, headers });

    const body = await req.json();
    const cheersId = String(body?.cheersId ?? "");
    if (!cheersId) return new Response(JSON.stringify({ error: "cheers_id_required" }), { status: 400, headers });

    const admin = createClient(supabaseUrl, serviceRole, { auth: { persistSession: false } });
    const { data: cheers, error: cheersError } = await admin.from("cheers").select("id, sender_id, receiver_id").eq("id", cheersId).single();
    if (cheersError || !cheers) return new Response(JSON.stringify({ error: "cheers_not_found" }), { status: 404, headers });
    if (cheers.sender_id !== caller.id) return new Response(JSON.stringify({ error: "forbidden" }), { status: 403, headers });

    const recipientId = cheers.receiver_id;
    const { data: blocked } = await admin.rpc("is_blocked_between", { user_a: caller.id, user_b: recipientId });
    if (blocked) return new Response(JSON.stringify({ ok: true, skipped: "blocked" }), { status: 200, headers });

    const [{ data: recipientProfile }, { data: senderProfile }, { data: pushTokens }, { data: reciprocal }] = await Promise.all([
      admin.from("profiles").select("is_active, active_until").eq("id", recipientId).maybeSingle(),
      admin.from("profiles").select("name").eq("id", caller.id).maybeSingle(),
      admin.from("device_push_tokens").select("token").eq("user_id", recipientId),
      admin.from("cheers").select("id").eq("sender_id", recipientId).eq("receiver_id", caller.id).maybeSingle(),
    ]);

    const activeUntil = recipientProfile?.active_until ? new Date(recipientProfile.active_until).getTime() : 0;
    if (recipientProfile?.is_active !== true || !Number.isFinite(activeUntil) || activeUntil <= Date.now()) {
      return new Response(JSON.stringify({ ok: true, skipped: "recipient_inactive" }), { status: 200, headers });
    }

    const tokens = (pushTokens ?? []).map((row: any) => row.token).filter((value: unknown) => typeof value === "string");
    if (!tokens.length) return new Response(JSON.stringify({ ok: true, skipped: "no_push_token" }), { status: 200, headers });

    const senderName = senderProfile?.name || "SipMate";
    const mutual = Boolean(reciprocal);
    const payload = tokens.map((pushToken: string) => ({
      to: pushToken,
      sound: "default",
      channelId: "cheers",
      title: mutual ? "🍻 CHEERS!" : "🍻 New Cheers!",
      body: mutual ? `You and ${senderName} are both up for a drink.` : `${senderName} sent you a Cheers.`,
      data: { type: "cheers", id: caller.id, name: senderName, mutual },
      priority: "high",
    }));

    const pushResponse = await fetch("https://exp.host/--/api/v2/push/send", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json", "Accept-Encoding": "gzip, deflate" },
      body: JSON.stringify(payload),
    });
    const result = await pushResponse.json().catch(() => ({}));
    if (!pushResponse.ok) return new Response(JSON.stringify({ error: "push_failed" }), { status: 502, headers });
    return new Response(JSON.stringify({ ok: true, mutual, result }), { status: 200, headers });
  } catch (error) {
    console.error("CHEERS NOTIFICATION ERROR", error);
    return new Response(JSON.stringify({ error: "server_error" }), { status: 500, headers });
  }
});
'''
          (function_dir / 'index.ts').write_text(function_code, encoding='utf-8', newline='\n')

          migration = Path('supabase/migrations/20260914154300_add_active_session_window.sql')
          migration.write_text('''alter table public.profiles
  add column if not exists active_until timestamptz;

grant select (active_until) on table public.profiles to authenticated;

create or replace function public.get_nearby_profiles(
  max_distance_km double precision default 10,
  custom_origin_latitude double precision default null,
  custom_origin_longitude double precision default null
)
returns table(
  id uuid,
  name text,
  age integer,
  city text,
  bio text,
  currently_up_for text,
  is_active boolean,
  avatar_url text,
  gender text,
  distance_km double precision
)
language plpgsql
stable
security definer
set search_path = pg_catalog, public
as $$
declare
  caller_id uuid := auth.uid();
  origin_lat double precision;
  origin_lon double precision;
  caller_premium boolean := false;
begin
  if caller_id is null then raise exception 'Authentication required'; end if;
  if max_distance_km is null or max_distance_km <= 0 or max_distance_km > 100 then raise exception 'max_distance_km must be between 0 and 100'; end if;
  if (custom_origin_latitude is null) <> (custom_origin_longitude is null) then raise exception 'Custom latitude and longitude must be supplied together'; end if;
  if custom_origin_latitude is not null and (custom_origin_latitude < -90 or custom_origin_latitude > 90) then raise exception 'Invalid custom latitude'; end if;
  if custom_origin_longitude is not null and (custom_origin_longitude < -180 or custom_origin_longitude > 180) then raise exception 'Invalid custom longitude'; end if;

  select p.latitude, p.longitude, coalesce(p.is_premium = true and (p.premium_until is null or p.premium_until > now()), false)
    into origin_lat, origin_lon, caller_premium
  from public.profiles p
  where p.id = caller_id;

  if caller_premium and custom_origin_latitude is not null then
    origin_lat := custom_origin_latitude;
    origin_lon := custom_origin_longitude;
  end if;

  if origin_lat is null or origin_lon is null then return; end if;

  return query
  select p.id, p.name, p.age, p.city, p.bio, p.currently_up_for, p.is_active, p.avatar_url, p.gender,
         ((round(d.distance_km::numeric * 2) / 2.0)::double precision) as distance_km
  from public.profiles p
  cross join lateral (
    select 6371.0 * 2.0 * asin(sqrt(least(1.0, greatest(0.0,
      power(sin(radians(p.latitude - origin_lat) / 2.0), 2) +
      cos(radians(origin_lat)) * cos(radians(p.latitude)) *
      power(sin(radians(p.longitude - origin_lon) / 2.0), 2)
    )))) as distance_km
  ) d
  where p.id <> caller_id
    and p.is_active = true
    and p.active_until is not null
    and p.active_until > now()
    and p.latitude is not null
    and p.longitude is not null
    and not public.is_blocked_between(caller_id, p.id)
    and not exists (
      select 1 from public.skipped_profiles s
      where s.user_id = caller_id and s.skipped_user_id = p.id
    )
    and d.distance_km <= max_distance_km
  order by d.distance_km asc;
end;
$$;

revoke all on function public.get_nearby_profiles(double precision, double precision, double precision) from public;
grant execute on function public.get_nearby_profiles(double precision, double precision, double precision) to authenticated;
''', encoding='utf-8', newline='\n')
