name: Patch Active Session Cheers Push

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Add active Nearby sessions and Cheers push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add active session and Cheers push flow
        run: |
          python - <<'PY'
          from pathlib import Path

          presence = Path('src/lib/presence.ts')
          s = presence.read_text(encoding='utf-8')
          anchor = "export const PRESENCE_TIMEOUT_MS = 90_000;\n"
          addition = anchor + "export const ACTIVE_SESSION_DURATION_MS = 3 * 60 * 60 * 1000;\n\nexport function getActiveUntilIso() {\n  return new Date(Date.now() + ACTIVE_SESSION_DURATION_MS).toISOString();\n}\n\nexport function isProfileAvailable(profile: {\n  is_active?: boolean | null;\n  active_until?: string | null;\n}) {\n  if (profile.is_active !== true || !profile.active_until) return false;\n  const activeUntil = new Date(profile.active_until).getTime();\n  return Number.isFinite(activeUntil) && activeUntil > Date.now();\n}\n"
          if anchor not in s:
              raise SystemExit('presence anchor not found')
          if 'ACTIVE_SESSION_DURATION_MS' not in s:
              s = s.replace(anchor, addition, 1)
          presence.write_text(s, encoding='utf-8', newline='\n')

          push = Path('src/lib/push-notifications.ts')
          s = push.read_text(encoding='utf-8')
          anchor = "    await Notifications.setNotificationChannelAsync('messages', {\n      name: 'Messages',\n      importance: Notifications.AndroidImportance.MAX,\n      vibrationPattern: [0, 250, 180, 250],\n      lightColor: '#EF4444',\n      sound: 'default',\n    });\n"
          addition = anchor + "\n    await Notifications.setNotificationChannelAsync('cheers', {\n      name: 'Cheers',\n      importance: Notifications.AndroidImportance.MAX,\n      vibrationPattern: [0, 180, 100, 280],\n      lightColor: '#EF4444',\n      sound: 'default',\n    });\n"
          if "setNotificationChannelAsync('cheers'" not in s:
              if anchor not in s:
                  raise SystemExit('push channel anchor not found')
              s = s.replace(anchor, addition, 1)
          push.write_text(s, encoding='utf-8', newline='\n')

          layout = Path('src/app/_layout.tsx')
          s = layout.read_text(encoding='utf-8')
          old = "    const openChatFromNotification = (response: Notifications.NotificationResponse) => {\n      const data = response.notification.request.content.data as Record<string, unknown>;\n      if (data?.type !== 'message' || !data?.conversationId) return;\n      router.push({\n        pathname: '/chat',\n        params: {\n          conversationId: String(data.conversationId),\n          name: String(data.name ?? 'SipMate'),\n          id: String(data.id ?? ''),\n        },\n      });\n    };\n"
          new = "    const openFromNotification = (response: Notifications.NotificationResponse) => {\n      const data = response.notification.request.content.data as Record<string, unknown>;\n\n      if (data?.type === 'message' && data?.conversationId) {\n        router.push({\n          pathname: '/chat',\n          params: {\n            conversationId: String(data.conversationId),\n            name: String(data.name ?? 'SipMate'),\n            id: String(data.id ?? ''),\n          },\n        });\n        return;\n      }\n\n      if (data?.type === 'cheers' && data?.id) {\n        router.push({ pathname: '/user-profile', params: { id: String(data.id) } });\n      }\n    };\n"
          if 'const openFromNotification' not in s:
              if old not in s:
                  raise SystemExit('notification handler anchor not found')
              s = s.replace(old, new, 1)
              s = s.replace('if (mounted && response) openChatFromNotification(response);', 'if (mounted && response) openFromNotification(response);', 1)
              s = s.replace('Notifications.addNotificationResponseReceivedListener(openChatFromNotification);', 'Notifications.addNotificationResponseReceivedListener(openFromNotification);', 1)
          layout.write_text(s, encoding='utf-8', newline='\n')

          home = Path('src/app/index.tsx')
          s = home.read_text(encoding='utf-8')
          if "getActiveUntilIso" not in s:
              s = s.replace("import { supabase } from '../lib/supabase';", "import { getActiveUntilIso, isProfileAvailable } from '../lib/presence';\nimport { showAlert } from '../lib/notify';\nimport { supabase } from '../lib/supabase';", 1)
          s = s.replace("  is_active: boolean;\n};", "  is_active: boolean;\n  active_until: string | null;\n};", 1)
          s = s.replace("'id, name, city, currently_up_for, is_active'", "'id, name, city, currently_up_for, is_active, active_until'")
          old = "      setProfile(data);\n      await loadActivityCount(session.user.id);\n"
          new = "      const sessionActive = isProfileAvailable(data);\n      if (data.is_active && !sessionActive) {\n        void supabase\n          .from('profiles')\n          .update({ is_active: false, active_until: null, last_seen_at: null })\n          .eq('id', session.user.id);\n      }\n      setProfile({ ...data, is_active: sessionActive });\n      await loadActivityCount(session.user.id);\n"
          if old in s:
              s = s.replace(old, new, 1)
          old = "        .update({\n          is_active: newStatus,\n          last_seen_at: newStatus ? new Date().toISOString() : null,\n        })\n"
          new = "        .update({\n          is_active: newStatus,\n          active_until: newStatus ? getActiveUntilIso() : null,\n          last_seen_at: newStatus ? new Date().toISOString() : null,\n        })\n"
          if old not in s:
              raise SystemExit('home toggle update anchor not found')
          s = s.replace(old, new, 1)
          old = "      setProfile({ ...profile, is_active: newStatus });\n      Vibration.vibrate(35);\n"
          new = "      setProfile({\n        ...profile,\n        is_active: newStatus,\n        active_until: newStatus ? getActiveUntilIso() : null,\n      });\n      Vibration.vibrate(35);\n\n      if (newStatus) {\n        showAlert(\n          language === 'de'\n            ? '🍻 Du bist jetzt 3 Stunden auf Nearby sichtbar. Wir benachrichtigen dich, wenn dir jemand Cheers sendet.'\n            : language === 'hr'\n              ? '🍻 Sada si 3 sata vidljiv na Nearbyu. Obavijestit ćemo te kad ti netko pošalje Cheers.'\n              : '🍻 You are now visible on Nearby for 3 hours. We will notify you when someone sends you Cheers.'\n        );\n      }\n"
          if old not in s:
              raise SystemExit('home toggle state anchor not found')
          s = s.replace(old, new, 1)
          home.write_text(s, encoding='utf-8', newline='\n')

          profile = Path('src/app/user-profile.tsx')
          s = profile.read_text(encoding='utf-8')
          s = s.replace("import { isProfileOnline } from '../lib/presence';", "import { isProfileAvailable } from '../lib/presence';", 1)
          s = s.replace("  last_seen_at: string | null;\n};", "  last_seen_at: string | null;\n  active_until: string | null;\n};", 1)
          s = s.replace(".select('id, name, age, city, bio, currently_up_for, is_active, last_seen_at, avatar_url')", ".select('id, name, age, city, bio, currently_up_for, is_active, last_seen_at, active_until, avatar_url')", 1)
          s = s.replace('  const online = isProfileOnline(profile);', '  const online = isProfileAvailable(profile);', 1)
          old = "    const { error: sendError } = await supabase.from('cheers').insert({\n      sender_id: senderId,\n      receiver_id: receiverId,\n    });\n\n    if (sendError && sendError.code !== '23505') {\n"
          new = "    const { data: sentCheersRow, error: sendError } = await supabase\n      .from('cheers')\n      .insert({\n        sender_id: senderId,\n        receiver_id: receiverId,\n      })\n      .select('id')\n      .maybeSingle();\n\n    if (sendError && sendError.code !== '23505') {\n"
          if old not in s:
              raise SystemExit('cheers insert anchor not found')
          s = s.replace(old, new, 1)
          anchor = "    const { data: mutualCheers, error: mutualError } = await supabase\n"
          addition = "    if (!sendError && sentCheersRow?.id) {\n      supabase.functions\n        .invoke('send-cheers-notification', { body: { cheersId: sentCheersRow.id } })\n        .then(({ error }) => {\n          if (error) console.log('CHEERS PUSH ERROR:', error.message);\n        });\n    }\n\n" + anchor
          if anchor not in s:
              raise SystemExit('mutual query anchor not found')
          s = s.replace(anchor, addition, 1)
          profile.write_text(s, encoding='utf-8', newline='\n')
          PY
      - name: Verify checks
        run: |
          npm ci
          npm run check
          npm run release:audit
      - name: Commit patch
        run: |
          git config user.name 'Baric-creator'
          git config user.email 'baric5555baric@gmail.com'
          git add src/lib/presence.ts src/lib/push-notifications.ts src/app/_layout.tsx src/app/index.tsx src/app/user-profile.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Add active Nearby sessions and Cheers push'
          git push origin master
