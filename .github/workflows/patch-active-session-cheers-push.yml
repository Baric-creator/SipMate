    if (sendError && sendError.code !== '23505') {
"""
          if old not in s:
              raise SystemExit('cheers insert anchor not found')
          s = s.replace(old, new, 1)
          anchor = """    const { data: mutualCheers, error: mutualError } = await supabase
"""
          addition = """    if (!sendError && sentCheersRow?.id) {
      supabase.functions
        .invoke('send-cheers-notification', { body: { cheersId: sentCheersRow.id } })
        .then(({ error }) => {
