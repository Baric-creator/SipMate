name: Patch Client Coordinate Guard

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Guard precise profile coordinates from client selects'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add coordinate privacy guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/security-audit.mjs')
          s=p.read_text(encoding='utf-8')
          anchor="""for (const file of clientFiles) {\n  const relative = path.relative(root, file).replaceAll('\\\\', '/');\n  const content = fs.readFileSync(file, 'utf8');\n  if (relative !== 'src/lib/notify.ts' && /\\bwindow\\.(?:alert|confirm)\\s*\\(/.test(content)) warn(`Browser-only alert/confirm still used in ${relative}`);\n  if (/\\.select\\(\\s*['\"]\\*['\"]\\s*\\)/.test(content)) warn(`Broad select('*') found in ${relative}; confirm every returned column is intended for the client`);\n}\n"""
          replacement="""for (const file of clientFiles) {\n  const relative = path.relative(root, file).replaceAll('\\\\', '/');\n  const content = fs.readFileSync(file, 'utf8');\n  if (relative !== 'src/lib/notify.ts' && /\\bwindow\\.(?:alert|confirm)\\s*\\(/.test(content)) warn(`Browser-only alert/confirm still used in ${relative}`);\n  if (/\\.select\\(\\s*['\"]\\*['\"]\\s*\\)/.test(content)) warn(`Broad select('*') found in ${relative}; confirm every returned column is intended for the client`);\n  if (/from\\(\\s*['\"]profiles['\"]\\s*\\)[\\s\\S]{0,240}?\\.select\\([^)]*\\b(?:latitude|longitude)\\b/i.test(content)) {\n    fail(`Client directly selects precise profile coordinates in ${relative}; use privacy-safe RPCs instead`);\n  }\n}\n"""
          if anchor not in s:
              raise SystemExit('security client scan anchor not found')
          s=s.replace(anchor,replacement,1)
          p.write_text(s,encoding='utf-8',newline='\n')
          PY
      - name: Verify checks
        run: |
          npm ci
          npm run check
          npm run release:audit
      - name: Commit patch
        run: |
          git config user.name 'Baric-creator'
          git config user.email 'baric5555baric@gmail.com'
          git add scripts/security-audit.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Guard precise profile coordinates from client selects'
          git push origin master
