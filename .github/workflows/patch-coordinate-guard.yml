name: Patch Client Coordinate Guard

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Guard precise profile coordinates from client selects'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add coordinate privacy guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/security-audit.mjs')
          s=p.read_text(encoding='utf-8')
          anchor="\nconsole.log(`Security audit checked ${textFiles.length} repository text files.`);"
          guard="""

// Precise profile coordinates must stay behind authenticated, privacy-safe RPCs.
for (const file of clientFiles) {
  const relative = path.relative(root, file).replaceAll('\\\\', '/');
  const content = fs.readFileSync(file, 'utf8');
  if (/from\\(\\s*['\"]profiles['\"]\\s*\\)[\\s\\S]{0,260}?\\.select\\([^)]*\\b(?:latitude|longitude)\\b/i.test(content)) {
    fail(`Client directly selects precise profile coordinates in ${relative}; use privacy-safe RPCs instead`);
  }
}
"""
          if anchor not in s:
              raise SystemExit('security audit footer anchor not found')
          if 'Client directly selects precise profile coordinates' not in s:
              s=s.replace(anchor,guard+anchor,1)
          p.write_text(s,encoding='utf-8',newline='\n')
          PY
      - name: Verify checks
        run: |
          npm ci
          npm run check
          npm run release:audit
      - name: Commit patch
        run: |
          git config user.name 'Baric-creator'
          git config user.email 'baric5555baric@gmail.com'
          git add scripts/security-audit.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Guard precise profile coordinates from client selects'
          git push origin master
