name: Patch Chat Release Polish

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Polish chat release edge cases'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch chat edge cases
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/app/chat.tsx')
          s=p.read_text(encoding='utf-8')

          s=s.replace("import { useLocalSearchParams, useRouter } from 'expo-router';", "import { useFocusEffect, useLocalSearchParams, useRouter } from 'expo-router';")
          s=s.replace("import { useEffect, useRef, useState } from 'react';", "import { useCallback, useEffect, useRef, useState } from 'react';")

          anchor="""  useEffect(() => {\n    if (!id || !myUserId) return;\n    async function checkBlockStatus() {\n      const { data, error } = await supabase.rpc('is_blocked_between', { user_a: myUserId, user_b: String(id) });\n      if (error) return console.log('BLOCK STATUS ERROR:', error.message);\n      setIsBlocked(Boolean(data));\n    }\n    checkBlockStatus();\n  }, [id, myUserId]);\n"""
          addition=anchor+"""\n  useFocusEffect(\n    useCallback(() => {\n      if (!id || !myUserId) return;\n      let active = true;\n      supabase.rpc('is_blocked_between', { user_a: myUserId, user_b: String(id) }).then(({ data, error }) => {\n        if (error) {\n          console.log('BLOCK STATUS REFRESH ERROR:', error.message);\n          return;\n        }\n        if (active) setIsBlocked(Boolean(data));\n      });\n      return () => { active = false; };\n    }, [id, myUserId])\n  );\n"""
          if anchor not in s:
              raise SystemExit('block-status anchor not found')
          s=s.replace(anchor, addition, 1)

          input_anchor='''            placeholder={text.placeholder}\n            placeholderTextColor="#71717A"\n            onSubmitEditing={sendMessage}\n            returnKeyType="send"\n'''
          input_new='''            placeholder={text.placeholder}\n            placeholderTextColor="#71717A"\n            maxLength={1000}\n            onSubmitEditing={sendMessage}\n            returnKeyType="send"\n'''
          if input_anchor not in s:
              raise SystemExit('text-input anchor not found')
          s=s.replace(input_anchor,input_new,1)

          p.write_text(s,encoding='utf-8',newline='\n')
          PY
      - name: Verify checks
        run: |
          npm ci
          npm run check
          npm run release:audit
      - name: Commit patch
        run: |
          git config user.name 'Baric-creator'
          git config user.email 'baric5555baric@gmail.com'
          git add src/app/chat.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Polish chat release edge cases'
          git push origin master
