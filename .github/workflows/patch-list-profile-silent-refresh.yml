name: Patch Lists And Profile Silent Refresh

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Polish chat list and profile refresh UX'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Polish refresh UX
        run: |
          python - <<'PY'
          from pathlib import Path

          chats = Path('src/app/chats.tsx')
          s = chats.read_text(encoding='utf-8')
          s = s.replace("import { useCallback, useEffect, useState } from 'react';", "import { useCallback, useEffect, useRef, useState } from 'react';", 1)
          s = s.replace("""  const [chats, setChats] = useState<ChatItem[]>([]);\n  const [loading, setLoading] = useState(true);\n\n  useFocusEffect(\n    useCallback(() => {\n      void loadChats();\n""", """  const [chats, setChats] = useState<ChatItem[]>([]);\n  const [loading, setLoading] = useState(true);\n  const hasLoadedChatsRef = useRef(false);\n\n  useFocusEffect(\n    useCallback(() => {\n      void loadChats(hasLoadedChatsRef.current);\n""", 1)
          s = s.replace("""        () => {\n          loadChats();\n        }\n""", """        () => {\n          void loadChats(true);\n        }\n""", 2)
          s = s.replace("""  async function loadChats() {\n    try {\n      setLoading(true);\n""", """  async function loadChats(silent = false) {\n    try {\n      if (!silent) setLoading(true);\n""", 1)
          s = s.replace("""    } finally {\n      setLoading(false);\n    }\n  }\n""", """    } finally {\n      hasLoadedChatsRef.current = true;\n      if (!silent) setLoading(false);\n    }\n  }\n""", 1)
          chats.write_text(s, encoding='utf-8', newline='\n')

          profile = Path('src/app/profile.tsx')
          s = profile.read_text(encoding='utf-8')
          s = s.replace("import { useCallback, useEffect, useState } from 'react';", "import { useCallback, useEffect, useRef, useState } from 'react';", 1)
          s = s.replace("""  const [profile, setProfile] = useState<UserProfile | null>(null);\n  const [loading, setLoading] = useState(true);\n""", """  const [profile, setProfile] = useState<UserProfile | null>(null);\n  const [loading, setLoading] = useState(true);\n  const hasLoadedProfileRef = useRef(false);\n""", 1)
          s = s.replace("""    useCallback(() => {\n      loadUserProfile();\n""", """    useCallback(() => {\n      void loadUserProfile(hasLoadedProfileRef.current);\n""", 1)
          s = s.replace("""      if (state === 'active') loadUserProfile();\n""", """      if (state === 'active') void loadUserProfile(true);\n""", 1)
          s = s.replace("""  async function loadUserProfile() {\n    try {\n      setLoading(true);\n""", """  async function loadUserProfile(silent = false) {\n    try {\n      if (!silent) setLoading(true);\n""", 1)
          s = s.replace("""    } finally { setLoading(false); }\n""", """    } finally {\n      hasLoadedProfileRef.current = true;\n      if (!silent) setLoading(false);\n    }\n""", 1)
          s = s.replace("""      await loadUserProfile();\n      showAlert(text.discordDisconnected);\n""", """      await loadUserProfile(true);\n      showAlert(text.discordDisconnected);\n""", 1)
          profile.write_text(s, encoding='utf-8', newline='\n')
          PY
      - name: Verify checks
        run: |
          npm ci
          npm run check
          npm run release:audit
      - name: Commit patch
        run: |
          git config user.name 'Baric-creator'
          git config user.email 'baric5555baric@gmail.com'
          git add src/app/chats.tsx src/app/profile.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Polish chat list and profile refresh UX'
          git push origin master
