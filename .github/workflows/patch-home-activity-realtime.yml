name: Patch Home Activity Realtime

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Keep home activity badge fresh in realtime'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep home activity badge fresh
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/index.tsx')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              "  useCallback,\n  useRef,\n  useState,\n} from 'react';",
              "  useCallback,\n  useEffect,\n  useRef,\n  useState,\n} from 'react';",
              1,
          )
          s = s.replace(
              "  const hasLoadedHomeRef = useRef(false);\n",
              "  const hasLoadedHomeRef = useRef(false);\n  const currentUserIdRef = useRef<string | null>(null);\n  const statusUpdateRef = useRef(false);\n",
              1,
          )
          anchor = "  useFocusEffect(\n    useCallback(() => {\n      void loadProfile(hasLoadedHomeRef.current);\n    }, [])\n  );\n"
          addition = anchor + "\n  useEffect(() => {\n    const refreshActivity = () => {\n      if (currentUserIdRef.current) {\n        void loadActivityCount(currentUserIdRef.current);\n      }\n    };\n\n    const channel = supabase\n      .channel('home-activity-updates')\n      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, refreshActivity)\n      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'messages' }, refreshActivity)\n      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'cheers' }, refreshActivity)\n      .subscribe();\n\n    return () => {\n      supabase.removeChannel(channel);\n    };\n  }, []);\n"
          if anchor not in s:
              raise SystemExit('focus effect anchor not found')
          s = s.replace(anchor, addition, 1)

          session_anchor = "      const myId = session.user.id;"
          if session_anchor in s:
              raise SystemExit('unexpected myId anchor already exists')

          auth_anchor = "      if (!session?.user) {\n        router.replace('/login');\n        return;\n      }\n\n      const { data, error } ="
          auth_replacement = "      if (!session?.user) {\n        currentUserIdRef.current = null;\n        router.replace('/login');\n        return;\n      }\n\n      currentUserIdRef.current = session.user.id;\n\n      const { data, error } ="
          if auth_anchor not in s:
              raise SystemExit('auth anchor not found')
          s = s.replace(auth_anchor, auth_replacement, 1)

          toggle_start = "  async function toggleActive() {\n    if (!profile) {\n      return;\n    }\n\n    const newStatus =\n      !profile.is_active;\n\n    const { error } =\n      await supabase\n        .from('profiles')\n        .update({\n          is_active: newStatus,\n          last_seen_at: newStatus ? new Date().toISOString() : null,\n        })\n        .eq('id', profile.id);\n\n    if (error) {\n      console.log(\n        'ACTIVE STATUS ERROR:',\n        error.message\n      );\n      return;\n    }\n\n    setProfile({\n      ...profile,\n      is_active: newStatus,\n    });\n\n    Vibration.vibrate(35);\n\n    console.log(\n      'ACTIVE STATUS:',\n      newStatus\n        ? 'ACTIVE'\n        : 'INACTIVE'\n    );\n  }\n"
          toggle_new = "  async function toggleActive() {\n    if (!profile || statusUpdateRef.current) {\n      return;\n    }\n\n    statusUpdateRef.current = true;\n    const newStatus = !profile.is_active;\n\n    try {\n      const { error } = await supabase\n        .from('profiles')\n        .update({\n          is_active: newStatus,\n          last_seen_at: newStatus ? new Date().toISOString() : null,\n        })\n        .eq('id', profile.id);\n\n      if (error) {\n        console.log('ACTIVE STATUS ERROR:', error.message);\n        return;\n      }\n\n      setProfile({ ...profile, is_active: newStatus });\n      Vibration.vibrate(35);\n    } finally {\n      statusUpdateRef.current = false;\n    }\n  }\n"
          if toggle_start not in s:
              raise SystemExit('toggle active anchor not found')
          s = s.replace(toggle_start, toggle_new, 1)

          p.write_text(s, encoding='utf-8', newline='\n')
          PY
      - name: Verify checks
        run: |
          npm ci
          npm run check
          npm run release:audit
      - name: Commit patch
        run: |
          git config user.name 'Baric-creator'
          git config user.email 'baric5555baric@gmail.com'
          git add src/app/index.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Keep home activity badge fresh in realtime'
          git push origin master
