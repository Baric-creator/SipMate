name: Patch Chat Send Guard

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Guard chat against duplicate sends'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard chat sends
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/app/chat.tsx')
          s=p.read_text(encoding='utf-8')

          s=s.replace("""  const [isBlocked, setIsBlocked] = useState(false);\n\n  const scrollViewRef""", """  const [isBlocked, setIsBlocked] = useState(false);\n  const [sendingMessage, setSendingMessage] = useState(false);\n\n  const scrollViewRef""", 1)

          old="""  async function sendMessage() {\n    const content = messageText.trim();\n    if (!content || !conversationId) return;\n    const { data: { session } } = await supabase.auth.getSession();\n    if (!session?.user) return;\n    const { data, error } = await supabase.from('messages').insert({\n      conversation_id: String(conversationId), sender_id: session.user.id, content,\n    }).select('id, conversation_id, sender_id, content, created_at, read_at').single();\n    if (error) {\n      console.log('MESSAGE SEND ERROR:', error.message);\n      const blocked = error.code === '42501' || error.message.toLowerCase().includes('row-level security');\n      showAlert(blocked ? text.blockedSend : `${text.sendError}: ${error.message}`);\n      return;\n    }\n    const sent = data as Message;\n    setMessages((prev) => prev.some((m) => m.id === sent.id) ? prev : [...prev, sent]);\n    Vibration.vibrate(20);\n    setMessageText('');\n\n    void supabase.functions.invoke('send-message-notification', {\n      headers: {\n        Authorization: `Bearer ${session.access_token}`,\n      },\n      body: { messageId: String(sent.id) },\n    }).then(({ error: notificationError }) => {\n      if (notificationError) {\n        console.log('MESSAGE PUSH ERROR:', notificationError.message);\n      }\n    }).catch((notificationError) => {\n      console.log('MESSAGE PUSH CRASH:', notificationError);\n    });\n\n    await sendTypingStatus(false);\n  }\n"""

          new="""  async function sendMessage() {\n    const content = messageText.trim();\n    if (!content || !conversationId || sendingMessage) return;\n\n    try {\n      setSendingMessage(true);\n      const { data: { session } } = await supabase.auth.getSession();\n      if (!session?.user) return;\n      const { data, error } = await supabase.from('messages').insert({\n        conversation_id: String(conversationId), sender_id: session.user.id, content,\n      }).select('id, conversation_id, sender_id, content, created_at, read_at').single();\n      if (error) {\n        console.log('MESSAGE SEND ERROR:', error.message);\n        const blocked = error.code === '42501' || error.message.toLowerCase().includes('row-level security');\n        showAlert(blocked ? text.blockedSend : `${text.sendError}: ${error.message}`);\n        return;\n      }\n      const sent = data as Message;\n      setMessages((prev) => prev.some((m) => m.id === sent.id) ? prev : [...prev, sent]);\n      Vibration.vibrate(20);\n      setMessageText('');\n\n      void supabase.functions.invoke('send-message-notification', {\n        headers: {\n          Authorization: `Bearer ${session.access_token}`,\n        },\n        body: { messageId: String(sent.id) },\n      }).then(({ error: notificationError }) => {\n        if (notificationError) {\n          console.log('MESSAGE PUSH ERROR:', notificationError.message);\n        }\n      }).catch((notificationError) => {\n        console.log('MESSAGE PUSH CRASH:', notificationError);\n      });\n\n      await sendTypingStatus(false);\n    } finally {\n      setSendingMessage(false);\n    }\n  }\n"""
          if old not in s:
              raise SystemExit('chat sendMessage anchor not found')
          s=s.replace(old,new,1)

          old_button="""          <TouchableOpacity style={[styles.sendButton, !messageText.trim() && styles.sendButtonDisabled]} onPress={sendMessage} disabled={!messageText.trim()} activeOpacity={0.8}>\n"""
          new_button="""          <TouchableOpacity\n            style={[styles.sendButton, (!messageText.trim() || sendingMessage) && styles.sendButtonDisabled]}\n            onPress={sendMessage}\n            disabled={!messageText.trim() || sendingMessage}\n            activeOpacity={0.8}\n          >\n"""
          if old_button not in s:
              raise SystemExit('chat send button anchor not found')
          s=s.replace(old_button,new_button,1)

          p.write_text(s,encoding='utf-8',newline='\n')
          PY
      - name: Verify checks
        run: |
          npm ci
          npm run check
          npm run release:audit
      - name: Commit patch
        run: |
          git config user.name 'Baric-creator'
          git config user.email 'baric5555baric@gmail.com'
          git add src/app/chat.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Guard chat against duplicate sends'
          git push origin master
