name: Patch Nearby Geocoding Polish

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Polish Nearby geocoding errors and input'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Polish Nearby geocoding
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/app/nearby.tsx')
          s=p.read_text(encoding='utf-8')

          if "import { showAlert } from '../lib/notify';" not in s:
              anchor="import { isProfileOnline } from '../lib/presence';\n"
              s=s.replace(anchor, anchor+"import { showAlert } from '../lib/notify';\n", 1)

          s=s.replace("""                  value={customCity}\n                  onChangeText={\n                    setCustomCity\n                  }\n""", """                  value={customCity}\n                  onChangeText={\n                    setCustomCity\n                  }\n                  maxLength={80}\n""", 1)

          old_fetch="""                        const results =\n                          await response.json();\n\n                        if (\n                          !results ||\n"""
          new_fetch="""                        if (!response.ok) {\n                          throw new Error(`Geocoding request failed: ${response.status}`);\n                        }\n\n                        const results =\n                          await response.json();\n\n                        if (\n                          !results ||\n"""
          if old_fetch not in s:
              raise SystemExit('Nearby geocoding response anchor not found')
          s=s.replace(old_fetch,new_fetch,1)

          s=s.replace("""                          alert(\n                            t(\n                              'nearbyScreen.locationNotFound'\n                            )\n                          );\n""", """                          showAlert(\n                            t(\n                              'nearbyScreen.locationNotFound'\n                            )\n                          );\n""", 1)
          s=s.replace("""                        alert(\n                          t(\n                            'nearbyScreen.locationError'\n                          )\n                        );\n""", """                        showAlert(\n                          t(\n                            'nearbyScreen.locationError'\n                          )\n                        );\n""", 1)

          p.write_text(s,encoding='utf-8',newline='\n')
          PY
      - name: Verify checks
        run: |
          npm ci
          npm run check
          npm run release:audit
      - name: Commit patch
        run: |
          git config user.name 'Baric-creator'
          git config user.email 'baric5555baric@gmail.com'
          git add src/app/nearby.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Polish Nearby geocoding errors and input'
          git push origin master
