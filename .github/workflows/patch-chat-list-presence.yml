name: Patch Chat List Presence Accuracy

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Use presence timeout for chat list status'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align chat list presence status
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/chats.tsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace("import { supabase } from '../lib/supabase';", "import { isProfileOnline } from '../lib/presence';\nimport { supabase } from '../lib/supabase';", 1)
          s = s.replace(".select('id, name, age, is_active, avatar_url')", ".select('id, name, age, is_active, last_seen_at, avatar_url')", 1)
          s = s.replace("isActive: otherProfile?.is_active ?? false,", "isActive: isProfileOnline(otherProfile ?? {}),", 1)
          p.write_text(s, encoding='utf-8', newline='\n')
          PY
      - name: Verify checks
        run: |
          npm ci
          npm run check
          npm run release:audit
      - name: Commit patch
        run: |
          git config user.name 'Baric-creator'
          git config user.email 'baric5555baric@gmail.com'
          git add src/app/chats.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Use presence timeout for chat list status'
          git push origin master
