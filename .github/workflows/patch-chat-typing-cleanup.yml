name: Patch Chat Typing Cleanup

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Polish chat typing lifecycle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Polish chat typing lifecycle
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/app/chat.tsx')
          s=p.read_text(encoding='utf-8')

          anchor="""  useEffect(() => {\n    if (!conversationId) return;\n    const channel = supabase.channel(`chat-${conversationId}`)\n"""
          insert="""  useEffect(() => {\n    return () => {\n      if (typingTimeoutRef.current) {\n        clearTimeout(typingTimeoutRef.current);\n        typingTimeoutRef.current = null;\n      }\n      void sendTypingStatus(false);\n    };\n  }, [conversationId, myUserId]);\n\n  useEffect(() => {\n    if (!conversationId) return;\n    const channel = supabase.channel(`chat-${conversationId}`)\n"""
          if anchor not in s:
              raise SystemExit('chat realtime anchor not found')
          s=s.replace(anchor,insert,1)

          old_guard="""    if (!content || !conversationId || sendingMessage) return;\n"""
          new_guard="""    if (!content || !conversationId || sendingMessage || isBlocked) return;\n"""
          if old_guard not in s:
              raise SystemExit('chat send guard anchor not found')
          s=s.replace(old_guard,new_guard,1)

          old_change="""            onChangeText={(value) => {\n              setMessageText(value);\n              sendTypingStatus(true);\n              if (typingTimeoutRef.current) clearTimeout(typingTimeoutRef.current);\n              typingTimeoutRef.current = setTimeout(() => sendTypingStatus(false), 1200);\n            }}\n"""
          new_change="""            onChangeText={(value) => {\n              setMessageText(value);\n              if (typingTimeoutRef.current) clearTimeout(typingTimeoutRef.current);\n              if (!value.trim()) {\n                void sendTypingStatus(false);\n                typingTimeoutRef.current = null;\n                return;\n              }\n              void sendTypingStatus(true);\n              typingTimeoutRef.current = setTimeout(() => {\n                void sendTypingStatus(false);\n                typingTimeoutRef.current = null;\n              }, 1200);\n            }}\n"""
          if old_change not in s:
              raise SystemExit('chat typing input anchor not found')
          s=s.replace(old_change,new_change,1)

          p.write_text(s,encoding='utf-8',newline='\n')
          PY
      - name: Verify checks
        run: |
          npm ci
          npm run check
          npm run release:audit
      - name: Commit patch
        run: |
          git config user.name 'Baric-creator'
          git config user.email 'baric5555baric@gmail.com'
          git add src/app/chat.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Polish chat typing lifecycle'
          git push origin master
