name: Patch Download Legal Links

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Add legal links to download page'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add legal links to download page
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('website/download.html')
          s=p.read_text(encoding='utf-8')
          if './privacy.html' in s and './terms.html' in s:
              print('already patched')
              raise SystemExit(0)
          s=s.replace('.lang button.active{color:#fff;border-color:#6b292d;background:#1b1113}', '.lang button.active{color:#fff;border-color:#6b292d;background:#1b1113}.legal-links{display:flex;gap:14px;flex-wrap:wrap;margin-top:16px}.legal-links a{color:#777780;text-decoration:none;font-size:12px}.legal-links a:hover{color:#fff}')
          needle='    <a class="back" href="./index.html" id="backLink">← Back to SipMate</a>\n    <div class="status" id="statusText">Checking launch status…</div>'
          replacement='    <a class="back" href="./index.html" id="backLink">← Back to SipMate</a>\n    <div class="legal-links"><a href="./privacy.html">Privacy</a><a href="./terms.html">Terms</a><a href="./contact.html">Support</a></div>\n    <div class="status" id="statusText">Checking launch status…</div>'
          if needle not in s:
              raise SystemExit('download insertion point not found')
          s=s.replace(needle,replacement)
          p.write_text(s,encoding='utf-8',newline='\n')
          PY
      - name: Verify links
        run: node scripts/website-link-audit.mjs
      - name: Commit patch
        run: |
          git config user.name 'Baric-creator'
          git config user.email 'baric5555baric@gmail.com'
          git add website/download.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add legal links to download page'
          git push origin master
