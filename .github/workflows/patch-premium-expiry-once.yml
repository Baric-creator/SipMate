name: Patch Premium Expiry Once
on:
  push:
    branches: [security-500m]
    paths: [scripts/patch-premium-expiry.mjs]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security-500m
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/patch-premium-expiry.mjs
      - run: npm ci
      - run: npm run check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/premium.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Use expiry-aware Premium status on Premium screen"
          git push origin HEAD:security-500m
