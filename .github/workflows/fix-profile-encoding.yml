name: Fix Profile Encoding

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  fix-profile-encoding:
    if: github.event.head_commit.message != 'Repair profile source encoding'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ftfy
        run: pip install ftfy
      - name: Repair profile.tsx encoding safely
        run: |
          python - <<'PY'
          from pathlib import Path
          from ftfy import fix_text

          p = Path('src/app/profile.tsx')
          b = p.read_bytes()

          # Decode a mostly-UTF-8 file while recovering isolated Windows-1252 bytes.
          out = []
          i = 0
          while i < len(b):
              decoded = False
              for n in (4, 3, 2, 1):
                  if i + n > len(b):
                      continue
                  chunk = b[i:i+n]
                  try:
                      s = chunk.decode('utf-8')
                  except UnicodeDecodeError:
                      continue
                  # Accept exactly one code point from the shortest valid UTF-8 unit.
                  if len(s) == 1:
                      out.append(s)
                      i += n
                      decoded = True
                      break
              if decoded:
                  continue
              out.append(bytes([b[i]]).decode('cp1252', errors='replace'))
              i += 1

          text = ''.join(out)
          fixed = fix_text(text)
          fixed.encode('utf-8', errors='strict')
          p.write_text(fixed, encoding='utf-8', newline='\n')
          print('profile.tsx is now valid UTF-8')
          PY
      - name: Show remaining encoding markers
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/app/profile.tsx')
          text=p.read_text(encoding='utf-8')
          bad=('Ã','Â','â€','âœ','ðŸ','ï¸')
          hits=[(i,l) for i,l in enumerate(text.splitlines(),1) if any(x in l for x in bad)]
          print('remaining suspicious lines:', len(hits))
          for i,l in hits[:50]: print(f'{i}: {l[:220]}')
          if hits: raise SystemExit(2)
          PY
      - name: Commit repaired file
        run: |
          if git diff --quiet -- src/app/profile.tsx; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'Baric-creator'
          git config user.email 'baric5555baric@gmail.com'
          git add src/app/profile.tsx
          git commit -m 'Repair profile source encoding'
          git push origin master
