name: Patch Active Session Cheers Push V2

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Add active Nearby sessions and Cheers push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply active session Cheers push patch
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/lib/presence.ts')
          s = p.read_text()
          if 'ACTIVE_SESSION_DURATION_MS' not in s:
              s = s.replace(
                  'export const PRESENCE_TIMEOUT_MS = 90_000;\n',
                  'export const PRESENCE_TIMEOUT_MS = 90_000;\nexport const ACTIVE_SESSION_DURATION_MS = 3 * 60 * 60 * 1000;\n\nexport function getActiveUntilIso() {\n  return new Date(Date.now() + ACTIVE_SESSION_DURATION_MS).toISOString();\n}\n\nexport function isProfileAvailable(profile: {\n  is_active?: boolean | null;\n  active_until?: string | null;\n}) {\n  if (profile.is_active !== true || !profile.active_until) return false;\n  const activeUntil = new Date(profile.active_until).getTime();\n  return Number.isFinite(activeUntil) && activeUntil > Date.now();\n}\n',
                  1,
              )
          p.write_text(s, newline='\n')

          p = Path('src/lib/push-notifications.ts')
          s = p.read_text()
          if "setNotificationChannelAsync('cheers'" not in s:
              anchor = "    await Notifications.setNotificationChannelAsync('messages', {\n      name: 'Messages',\n      importance: Notifications.AndroidImportance.MAX,\n      vibrationPattern: [0, 250, 180, 250],\n      lightColor: '#EF4444',\n      sound: 'default',\n    });\n"
              s = s.replace(anchor, anchor + "\n    await Notifications.setNotificationChannelAsync('cheers', {\n      name: 'Cheers',\n      importance: Notifications.AndroidImportance.MAX,\n      vibrationPattern: [0, 180, 100, 280],\n      lightColor: '#EF4444',\n      sound: 'default',\n    });\n", 1)
          p.write_text(s, newline='\n')

          p = Path('src/app/_layout.tsx')
          s = p.read_text()
          if 'const openFromNotification' not in s:
              old = "    const openChatFromNotification = (response: Notifications.NotificationResponse) => {\n      const data = response.notification.request.content.data as Record<string, unknown>;\n      if (data?.type !== 'message' || !data?.conversationId) return;\n      router.push({\n        pathname: '/chat',\n        params: {\n          conversationId: String(data.conversationId),\n          name: String(data.name ?? 'SipMate'),\n          id: String(data.id ?? ''),\n        },\n      });\n    };\n"
              new = "    const openFromNotification = (response: Notifications.NotificationResponse) => {\n      const data = response.notification.request.content.data as Record<string, unknown>;\n      if (data?.type === 'message' && data?.conversationId) {\n        router.push({ pathname: '/chat', params: { conversationId: String(data.conversationId), name: String(data.name ?? 'SipMate'), id: String(data.id ?? '') } });\n        return;\n      }\n      if (data?.type === 'cheers' && data?.id) {\n        router.push({ pathname: '/user-profile', params: { id: String(data.id) } });\n      }\n    };\n"
              s = s.replace(old, new, 1)
              s = s.replace('if (mounted && response) openChatFromNotification(response);', 'if (mounted && response) openFromNotification(response);', 1)
              s = s.replace('Notifications.addNotificationResponseReceivedListener(openChatFromNotification);', 'Notifications.addNotificationResponseReceivedListener(openFromNotification);', 1)
          p.write_text(s, newline='\n')

          p = Path('src/app/index.tsx')
          s = p.read_text()
          if "getActiveUntilIso" not in s:
              s = s.replace("import { supabase } from '../lib/supabase';", "import { getActiveUntilIso, isProfileAvailable } from '../lib/presence';\nimport { showAlert } from '../lib/notify';\nimport { supabase } from '../lib/supabase';", 1)
          s = s.replace('  is_active: boolean;\n};', '  is_active: boolean;\n  active_until: string | null;\n};', 1)
          s = s.replace("'id, name, city, currently_up_for, is_active'", "'id, name, city, currently_up_for, is_active, active_until'")
          s = s.replace("      setProfile(data);\n      await loadActivityCount(session.user.id);\n", "      const sessionActive = isProfileAvailable(data);\n      if (data.is_active && !sessionActive) {\n        void supabase.from('profiles').update({ is_active: false, active_until: null, last_seen_at: null }).eq('id', session.user.id);\n      }\n      setProfile({ ...data, is_active: sessionActive });\n      await loadActivityCount(session.user.id);\n", 1)
          s = s.replace("        .update({\n          is_active: newStatus,\n          last_seen_at: newStatus ? new Date().toISOString() : null,\n        })\n", "        .update({\n          is_active: newStatus,\n          active_until: newStatus ? getActiveUntilIso() : null,\n          last_seen_at: newStatus ? new Date().toISOString() : null,\n        })\n", 1)
          s = s.replace("      setProfile({ ...profile, is_active: newStatus });\n      Vibration.vibrate(35);\n", "      setProfile({ ...profile, is_active: newStatus, active_until: newStatus ? getActiveUntilIso() : null });\n      Vibration.vibrate(35);\n      if (newStatus) {\n        showAlert(language === 'de' ? '🍻 Du bist jetzt 3 Stunden auf Nearby sichtbar. Wir benachrichtigen dich, wenn dir jemand Cheers sendet.' : language === 'hr' ? '🍻 Sada si 3 sata vidljiv na Nearbyu. Obavijestit ćemo te kad ti netko pošalje Cheers.' : '🍻 You are now visible on Nearby for 3 hours. We will notify you when someone sends you Cheers.');\n      }\n", 1)
          p.write_text(s, newline='\n')

          p = Path('src/app/user-profile.tsx')
          s = p.read_text()
          s = s.replace("import { isProfileOnline } from '../lib/presence';", "import { isProfileAvailable } from '../lib/presence';", 1)
          s = s.replace('  last_seen_at: string | null;\n};', '  last_seen_at: string | null;\n  active_until: string | null;\n};', 1)
          s = s.replace(".select('id, name, age, city, bio, currently_up_for, is_active, last_seen_at, avatar_url')", ".select('id, name, age, city, bio, currently_up_for, is_active, last_seen_at, active_until, avatar_url')", 1)
          s = s.replace('  const online = isProfileOnline(profile);', '  const online = isProfileAvailable(profile);', 1)
          old = "    const { error: sendError } = await supabase.from('cheers').insert({\n      sender_id: senderId,\n      receiver_id: receiverId,\n    });\n"
          new = "    const { data: sentCheersRow, error: sendError } = await supabase.from('cheers').insert({\n      sender_id: senderId,\n      receiver_id: receiverId,\n    }).select('id').maybeSingle();\n"
          s = s.replace(old, new, 1)
          anchor = "    const { data: mutualCheers, error: mutualError } = await supabase\n"
          if "send-cheers-notification" not in s:
              s = s.replace(anchor, "    if (!sendError && sentCheersRow?.id) {\n      supabase.functions.invoke('send-cheers-notification', { body: { cheersId: sentCheersRow.id } }).then(({ error }) => {\n        if (error) console.log('CHEERS PUSH ERROR:', error.message);\n      });\n    }\n\n" + anchor, 1)
          p.write_text(s, newline='\n')
          PY
      - name: Verify checks
        run: |
          npm ci
          npm run check
          npm run release:audit
      - name: Commit patch
        run: |
          git config user.name 'Baric-creator'
          git config user.email 'baric5555baric@gmail.com'
          git add src/lib/presence.ts src/lib/push-notifications.ts src/app/_layout.tsx src/app/index.tsx src/app/user-profile.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Add active Nearby sessions and Cheers push'
          git push origin master
