name: NPM Audit Report

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Trace vulnerable package
        run: |
          npm ls js-yaml --all || true
          npm audit fix --package-lock-only --dry-run || true
          npm audit --json || true
