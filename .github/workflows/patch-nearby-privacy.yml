name: Patch Nearby Privacy

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Use privacy-safe nearby profile RPC'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Nearby to use server-side distance RPC
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/app/nearby.tsx')
          s=p.read_text(encoding='utf-8')
          start=s.index("      const {\n        data: profiles,")
          target="""      setNearbyProfiles(\n        profilesWithDistance\n      );"""
          end=s.index(target,start)+len(target)
          replacement="""      const {\n        data: profiles,\n        error,\n      } = await supabase.rpc('get_nearby_profiles', {\n        max_distance_km: maxDistance,\n        custom_origin_latitude:\n          isPremium && customLatitude !== null\n            ? customLatitude\n            : null,\n        custom_origin_longitude:\n          isPremium && customLongitude !== null\n            ? customLongitude\n            : null,\n      });\n\n      if (error) {\n        console.log(\n          'NEARBY LOAD ERROR:',\n          error.message\n        );\n        return;\n      }\n\n      const profilesWithDistance =\n        (profiles ?? [])\n          .map((p) => ({\n            ...p,\n            distance:\n              typeof p.distance_km === 'number'\n                ? p.distance_km\n                : Number(p.distance_km ?? 0),\n          }))\n          .filter(\n            (p) =>\n              drinkFilter ===\n                'All' ||\n              p.currently_up_for ===\n                drinkFilter\n          )\n          .filter((p) => {\n            if (\n              !isPremium ||\n              ageFilter === 'All'\n            ) {\n              return true;\n            }\n\n            if (p.age == null) {\n              return false;\n            }\n\n            if (ageFilter === '18-25') return p.age >= 18 && p.age <= 25;\n            if (ageFilter === '26-35') return p.age >= 26 && p.age <= 35;\n            if (ageFilter === '36-45') return p.age >= 36 && p.age <= 45;\n            if (ageFilter === '46+') return p.age >= 46;\n            return true;\n          })\n          .filter((p) => {\n            if (\n              !isPremium ||\n              genderFilter === 'All'\n            ) {\n              return true;\n            }\n            return p.gender === genderFilter;\n          })\n          .sort((a, b) => a.distance - b.distance);\n\n      setNearbyProfiles(\n        profilesWithDistance\n      );"""
          s=s[:start]+replacement+s[end:]
          p.write_text(s,encoding='utf-8',newline='\n')
          PY
      - name: Verify checks
        run: |
          npm ci
          npm run check
          npm run release:audit
      - name: Commit patch
        run: |
          git config user.name 'Baric-creator'
          git config user.email 'baric5555baric@gmail.com'
          git add src/app/nearby.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Use privacy-safe nearby profile RPC'
          git push origin master
