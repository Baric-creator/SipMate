name: Patch Read Message Push Skip

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Skip push for already-read messages'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch message push read guard
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('supabase/functions/send-message-notification/index.ts')
          s = p.read_text(encoding='utf-8')
          old_select = '.select("id, conversation_id, sender_id, content")'
          new_select = '.select("id, conversation_id, sender_id, content, read_at")'
          if old_select not in s:
              raise SystemExit('message select anchor missing')
          s = s.replace(old_select, new_select, 1)

          old_guard = '    if (message.sender_id !== caller.id) return new Response(JSON.stringify({ error: "forbidden" }), { status: 403, headers });\n\n'
          new_guard = old_guard + '    if (message.read_at) return new Response(JSON.stringify({ ok: true, skipped: "already_read" }), { status: 200, headers });\n\n'
          if 'skipped: "already_read"' not in s:
              if old_guard not in s:
                  raise SystemExit('message sender guard anchor missing')
              s = s.replace(old_guard, new_guard, 1)
          p.write_text(s, encoding='utf-8', newline='\n')

          p = Path('scripts/release-audit.mjs')
          s = p.read_text(encoding='utf-8')
          anchor = "  assert(s.includes('is_blocked_between'), 'Message notification endpoint no longer checks blocked users');\n"
          addition = anchor + "  assert(s.includes('already_read'), 'Message notification endpoint no longer skips already-read messages');\n"
          if 'Message notification endpoint no longer skips already-read messages' not in s:
              if anchor not in s:
                  raise SystemExit('release audit message push anchor missing')
              s = s.replace(anchor, addition, 1)
          p.write_text(s, encoding='utf-8', newline='\n')
          PY
      - name: Verify checks
        run: |
          npm ci
          npm run check
          npm run release:audit
      - name: Commit patch
        run: |
          git config user.name 'Baric-creator'
          git config user.email 'baric5555baric@gmail.com'
          git add supabase/functions/send-message-notification/index.ts scripts/release-audit.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Skip push for already-read messages'
          git push origin master
