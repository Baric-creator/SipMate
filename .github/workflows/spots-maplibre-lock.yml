name: Prepare Spots MapLibre lockfile

on:
  push:
    branches:
      - feature/premium-places-mvp
    paths:
      - .github/workflows/spots-maplibre-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/premium-places-mvp

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Add pinned MapLibre dependency and refresh lockfile
        run: npm install --package-lock-only --save-exact @maplibre/maplibre-react-native@11.4.0

      - name: Commit dependency metadata
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Add MapLibre native dependency for Spots"
          git push origin HEAD:feature/premium-places-mvp
