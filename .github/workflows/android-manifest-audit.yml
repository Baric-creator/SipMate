name: Android Manifest Audit

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  manifest-audit:
    if: github.event.head_commit.message != 'Remove one-time Android manifest audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prebuild Android project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Generate merged release manifest
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:processReleaseMainManifest --no-daemon
      - name: Print merged release permissions
        run: |
          echo '--- merged release manifest candidates ---'
          find android/app/build/intermediates -type f -name AndroidManifest.xml | sort
          echo '--- merged release permission summary ---'
          MANIFEST=$(find android/app/build/intermediates -type f -name AndroidManifest.xml | grep -E '/merged_manifest/|/merged_manifests/' | grep -E '/release/' | head -n 1)
          if [ -z "$MANIFEST" ]; then
            MANIFEST=$(find android/app/build/intermediates -type f -name AndroidManifest.xml | grep -E '/release/' | head -n 1)
          fi
          echo "Using: $MANIFEST"
          test -n "$MANIFEST"
          cat "$MANIFEST"
          echo '--- final uses-permission summary ---'
          grep -o '<uses-permission[^>]*>' "$MANIFEST" | sort -u || true
          echo '--- package/application hints ---'
          grep -E 'package=|applicationId|namespace' "$MANIFEST" android/app/build.gradle android/build.gradle 2>/dev/null || true
