name: Patch User Profile Parallel Load

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Parallelize user profile data loading'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parallelize user profile loading
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/user-profile.tsx')
          s = p.read_text(encoding='utf-8')

          old = """    const { data: sentCheers } = await supabase
      .from('cheers')
      .select('id')
      .eq('sender_id', myId)
      .eq('receiver_id', targetUserId)
      .maybeSingle();

    const { data: receivedCheers } = await supabase
      .from('cheers')
      .select('id')
      .eq('sender_id', targetUserId)
      .eq('receiver_id', myId)
      .maybeSingle();
"""
          new = """    const [{ data: sentCheers }, { data: receivedCheers }] = await Promise.all([
      supabase
        .from('cheers')
        .select('id')
        .eq('sender_id', myId)
        .eq('receiver_id', targetUserId)
        .maybeSingle(),
      supabase
        .from('cheers')
        .select('id')
        .eq('sender_id', targetUserId)
        .eq('receiver_id', myId)
        .maybeSingle(),
    ]);
"""
          if old not in s:
              raise SystemExit('cheers status anchor not found')
          s = s.replace(old, new, 1)

          start = s.index("      const { data: myProfile, error: premiumError } = await supabase")
          end_marker = "      if (data?.id) await checkCheersStatus(data.id);"
          end = s.index(end_marker, start) + len(end_marker)
          replacement = """      const [premiumResult, profileResult, photosResult] = await Promise.all([
        supabase
          .from('profiles')
          .select('is_premium, premium_until')
          .eq('id', session.user.id)
          .maybeSingle(),
        supabase
          .from('profiles')
          .select('id, name, age, city, bio, currently_up_for, is_active, last_seen_at, avatar_url')
          .eq('id', targetId)
          .maybeSingle(),
        supabase
          .from('profile_photos')
          .select('id, photo_url, sort_order')
          .eq('user_id', targetId)
          .order('sort_order', { ascending: true }),
      ]);

      if (premiumResult.error) {
        console.log('PREMIUM STATUS ERROR:', premiumResult.error.message);
      }

      const premiumActive =
        premiumResult.data?.is_premium === true &&
        (!premiumResult.data.premium_until ||
          new Date(premiumResult.data.premium_until) > new Date());
      setIsPremium(premiumActive);

      if (photosResult.error) {
        console.log('USER PROFILE PHOTOS ERROR:', photosResult.error.message);
        setProfilePhotos([]);
      } else {
        setProfilePhotos((photosResult.data ?? []) as ProfilePhoto[]);
      }

      if (profileResult.error) {
        console.log('PROFILE LOAD ERROR:', profileResult.error.message);
        setProfile(null);
        return;
      }

      setProfile(profileResult.data as UserProfile | null);
      if (profileResult.data?.id) await checkCheersStatus(profileResult.data.id);"""
          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding='utf-8', newline='\n')
          PY
      - name: Verify checks
        run: |
          npm ci
          npm run check
          npm run release:audit
      - name: Commit patch
        run: |
          git config user.name 'Baric-creator'
          git config user.email 'baric5555baric@gmail.com'
          git add src/app/user-profile.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Parallelize user profile data loading'
          git push origin master
