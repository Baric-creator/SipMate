name: Patch Active Session Release Guard

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Guard active Nearby session release flow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard active session release flow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/release-audit.mjs')
          s = p.read_text(encoding='utf-8')
          s = s.replace("  'src/lib/push-notifications.ts',\n", "  'src/lib/push-notifications.ts',\n  'src/lib/presence.ts',\n  'supabase/functions/send-cheers-notification/index.ts',\n  'supabase/migrations/20260914142559_add_active_session_window.sql',\n", 1)
          anchor = "  assert(s.includes(\"supabase.from('cheers').insert\"), 'Cheers send action is missing');\n"
          if anchor not in s: raise SystemExit('user-profile guard anchor missing')
          s = s.replace(anchor, anchor + "  assert(s.includes(\"supabase.functions.invoke('send-cheers-notification'\"), 'Cheers push notification call is missing');\n", 1)
          anchor = "  assert(s.includes(\"Notifications.setNotificationChannelAsync('messages'\"), 'Android message notification channel is missing');\n"
          if anchor not in s: raise SystemExit('push guard anchor missing')
          s = s.replace(anchor, anchor + "  assert(s.includes(\"Notifications.setNotificationChannelAsync('cheers'\"), 'Android Cheers notification channel is missing');\n", 1)
          anchor = "  assert(s.includes(\"pathname: '/chat'\"), 'Message notifications no longer deep-link into chat');\n"
          if anchor not in s: raise SystemExit('layout guard anchor missing')
          s = s.replace(anchor, anchor + "  assert(s.includes(\"pathname: '/user-profile'\"), 'Cheers notifications no longer deep-link into sender profile');\n", 1)
          insert_before = "if (exists('supabase/functions/admin-moderation/index.ts')) {\n"
          block = "if (exists('src/lib/presence.ts')) {\n  const s = read('src/lib/presence.ts');\n  assert(s.includes('ACTIVE_SESSION_DURATION_MS = 3 * 60 * 60 * 1000'), 'Nearby Active session duration changed unexpectedly');\n  assert(s.includes('isProfileAvailable'), 'Active session availability helper is missing');\n}\n\nif (exists('supabase/functions/send-cheers-notification/index.ts')) {\n  const s = read('supabase/functions/send-cheers-notification/index.ts');\n  assert(s.includes('auth.getUser(token)'), 'Cheers notification endpoint no longer validates caller JWT');\n  assert(s.includes('active_until'), 'Cheers notification endpoint no longer checks Active session expiry');\n  assert(s.includes('recipient_inactive'), 'Cheers notification endpoint no longer skips inactive recipients');\n  assert(s.includes('channelId: \\\"cheers\\\"'), 'Cheers push no longer uses the dedicated notification channel');\n}\n\nif (exists('supabase/migrations/20260914142559_add_active_session_window.sql')) {\n  const s = read('supabase/migrations/20260914142559_add_active_session_window.sql');\n  assert(s.includes('add column if not exists active_until timestamptz'), 'Active session database column migration is missing');\n  assert(s.includes('p.active_until > now()'), 'Nearby RPC no longer honors Active session expiry');\n  assert(!s.includes(\"p.last_seen_at >= now() - interval '90 seconds'\"), 'Nearby RPC still expires users when the app goes to background');\n}\n\n"
          if insert_before not in s: raise SystemExit('admin moderation anchor missing')
          s = s.replace(insert_before, block + insert_before, 1)
          p.write_text(s, encoding='utf-8', newline='\n')
          PY
      - name: Verify checks
        run: |
          npm ci
          npm run check
          npm run release:audit
      - name: Commit patch
        run: |
          git config user.name 'Baric-creator'
          git config user.email 'baric5555baric@gmail.com'
          git add scripts/release-audit.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Guard active Nearby session release flow'
          git push origin master
