name: Patch Nearby Premium State

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Use current Premium entitlement in Nearby load'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Nearby Premium state timing
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/app/nearby.tsx')
          s=p.read_text(encoding='utf-8')

          old="""        custom_origin_latitude:\n          isPremium && customLatitude !== null\n            ? customLatitude\n            : null,\n        custom_origin_longitude:\n          isPremium && customLongitude !== null\n            ? customLongitude\n            : null,\n"""
          new="""        custom_origin_latitude:\n          premiumActive && customLatitude !== null\n            ? customLatitude\n            : null,\n        custom_origin_longitude:\n          premiumActive && customLongitude !== null\n            ? customLongitude\n            : null,\n"""
          if old not in s:
              raise SystemExit('Nearby custom location premium anchor not found')
          s=s.replace(old,new,1)

          s=s.replace("""              !isPremium ||\n              ageFilter === 'All'\n""", """              !premiumActive ||\n              ageFilter === 'All'\n""", 1)
          s=s.replace("""              !isPremium ||\n              genderFilter === 'All'\n""", """              !premiumActive ||\n              genderFilter === 'All'\n""", 1)

          p.write_text(s,encoding='utf-8',newline='\n')
          PY
      - name: Verify checks
        run: |
          npm ci
          npm run check
          npm run release:audit
      - name: Commit patch
        run: |
          git config user.name 'Baric-creator'
          git config user.email 'baric5555baric@gmail.com'
          git add src/app/nearby.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Use current Premium entitlement in Nearby load'
          git push origin master
