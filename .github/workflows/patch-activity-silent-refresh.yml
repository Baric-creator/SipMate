name: Patch Activity Silent Refresh

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Avoid Activity skeleton flicker on realtime refresh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Polish Activity realtime refresh
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/app/activity.tsx')
          s=p.read_text(encoding='utf-8')

          s=s.replace('void loadActivity();', 'void loadActivity(false);', 1)
          s=s.replace("""        void loadActivity();\n      })\n      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'messages' }, () => {\n        void loadActivity();\n      })\n      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'cheers' }, () => {\n        void loadActivity();\n      })\n      .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'cheers' }, () => {\n        void loadActivity();\n""", """        void loadActivity(true);\n      })\n      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'messages' }, () => {\n        void loadActivity(true);\n      })\n      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'cheers' }, () => {\n        void loadActivity(true);\n      })\n      .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'cheers' }, () => {\n        void loadActivity(true);\n""", 1)

          old="""  async function loadActivity() {\n    try {\n      setLoading(true);\n"""
          new="""  async function loadActivity(silent = false) {\n    try {\n      if (!silent) setLoading(true);\n"""
          if old not in s:
              raise SystemExit('Activity loader anchor not found')
          s=s.replace(old,new,1)

          old_final="""    } finally {\n      setLoading(false);\n    }\n  }\n"""
          new_final="""    } finally {\n      if (!silent) setLoading(false);\n    }\n  }\n"""
          if old_final not in s:
              raise SystemExit('Activity finally anchor not found')
          s=s.replace(old_final,new_final,1)

          p.write_text(s,encoding='utf-8',newline='\n')
          PY
      - name: Verify checks
        run: |
          npm ci
          npm run check
          npm run release:audit
      - name: Commit patch
        run: |
          git config user.name 'Baric-creator'
          git config user.email 'baric5555baric@gmail.com'
          git add src/app/activity.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Avoid Activity skeleton flicker on realtime refresh'
          git push origin master
