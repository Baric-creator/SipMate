name: Patch Webhook Once
on:
  push:
    branches: [security-500m]
jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Run one-off webhook idempotency patch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security-500m
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/patch-webhook-idempotency.mjs
      - run: npm ci
      - run: npm run check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/stripe-webhook/index.ts
          git commit -m "Make Stripe webhook replay-safe"
          git push origin security-500m
