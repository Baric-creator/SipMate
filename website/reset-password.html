<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#080808">
  <title>Reset Password — SipMate</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 85% 10%,rgba(115,15,18,.28),transparent 28%),radial-gradient(circle at 10% 90%,rgba(85,10,15,.18),transparent 28%),#080808;color:#f5f5f3;font-family:Inter,Arial,sans-serif}.shell{width:min(620px,calc(100% - 30px));margin:auto}.top{min-height:84px;display:flex;align-items:center;justify-content:space-between}.brand{color:#fff;text-decoration:none;font-size:25px;font-weight:900;letter-spacing:-1px}.brand span{color:#ff3b30}.badge{font-size:11px;font-weight:800;letter-spacing:1.3px;color:#ff736b;border:1px solid #4b2422;background:#17100f;padding:8px 11px;border-radius:999px}.wrap{padding:60px 0 90px}.card{border:1px solid #262626;border-radius:28px;background:linear-gradient(145deg,#151515,#0d0d0d);box-shadow:0 30px 90px rgba(0,0,0,.42);padding:30px}.eyebrow{font-size:11px;letter-spacing:1.8px;color:#ff5a52;font-weight:900}.card h1{font-size:clamp(38px,7vw,58px);line-height:.98;letter-spacing:-2px;margin:13px 0 12px}.muted{color:#96969d;line-height:1.65}.grid{display:grid;gap:14px;margin-top:24px}.field{display:grid;gap:8px}.field label{font-size:12px;color:#a7a7ad;font-weight:700}.field input{width:100%;height:52px;border:1px solid #303036;border-radius:14px;background:#101012;color:#fff;padding:0 15px;font:500 14px Inter;outline:none}.field input:focus{border-color:#72312d;box-shadow:0 0 0 3px rgba(255,59,48,.08)}.btn{height:52px;border:0;border-radius:14px;background:#ff3b30;color:#fff;font:800 14px Inter;cursor:pointer}.btn:disabled{opacity:.6;cursor:wait}.msg{min-height:22px;margin-top:14px;font-size:13px;font-weight:700;color:#aaa}.msg.ok{color:#56d68a}.msg.err{color:#ff756d}.back{display:inline-block;margin-top:18px;color:#aaa;text-decoration:none;font-size:13px}.back:hover{color:#fff}
  </style>
</head>
<body>
<div class="shell">
  <header class="top"><a class="brand" href="./index.html"><span>Sip</span>Mate 🍻</a><span class="badge">PASSWORD RESET</span></header>
  <main class="wrap">
    <section class="card">
      <p class="eyebrow">SECURE RECOVERY</p>
      <h1>Set a new password</h1>
      <p class="muted" id="intro">Open this page from the password recovery email, then choose a new SipMate admin password.</p>
      <form id="resetForm" class="grid">
        <div class="field"><label for="password">New password</label><input id="password" type="password" autocomplete="new-password" minlength="10" required></div>
        <div class="field"><label for="confirm">Confirm new password</label><input id="confirm" type="password" autocomplete="new-password" minlength="10" required></div>
        <button class="btn" id="saveBtn" type="submit">Save new password</button>
      </form>
      <div class="msg" id="msg"></div>
      <a class="back" href="./admin-launch.html">← Back to Launch Admin</a>
    </section>
  </main>
</div>
<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
  const SUPABASE_URL='https://poatmbsfglhrcdbosinb.supabase.co';
  const SUPABASE_KEY='sb_publishable_VooWOnzPl1SCUA44rZDTow_Ee5XrMd3';
  const supabase=createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  const form=document.getElementById('resetForm');
  const pw=document.getElementById('password');
  const confirmPw=document.getElementById('confirm');
  const msg=document.getElementById('msg');
  const saveBtn=document.getElementById('saveBtn');
  function show(text,kind=''){msg.className=`msg ${kind}`;msg.textContent=text||''}
  form.addEventListener('submit',async e=>{
    e.preventDefault();
    if(pw.value!==confirmPw.value){show('Passwords do not match.','err');return}
    if(pw.value.length<10){show('Use at least 10 characters.','err');return}
    saveBtn.disabled=true;show('Saving…');
    const {error}=await supabase.auth.updateUser({password:pw.value});
    saveBtn.disabled=false;
    if(error){show(error.message,'err');return}
    show('Password updated. Redirecting to Launch Admin…','ok');
    setTimeout(()=>location.href='./admin-launch.html',1200);
  });
  supabase.auth.onAuthStateChange((event)=>{
    if(event==='PASSWORD_RECOVERY') show('Recovery link verified. Choose your new password.','ok');
  });
</script>
</body>
</html>
