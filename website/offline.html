<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080808">
  <title>SipMate — Offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#08080a;color:#fff;font-family:Inter,system-ui,sans-serif;padding:24px}
    main{width:min(520px,100%);text-align:center;padding:34px 26px;border-radius:26px;background:#141417;border:1px solid #2b2b31;box-shadow:0 30px 90px rgba(0,0,0,.45)}
    .logo{color:#ef4444;font-size:18px;font-weight:900}.icon{font-size:54px;margin:22px 0 12px}h1{font-size:34px;line-height:1;margin:0 0 12px}p{color:#9b9ba3;line-height:1.6;margin:0 0 24px}
    button{border:0;border-radius:15px;padding:14px 20px;background:#dc2626;color:#fff;font-weight:900;font-size:14px;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <div class="logo">SipMate 🍻</div>
    <div class="icon">📡</div>
    <h1>You’re offline.</h1>
    <p>SipMate will be waiting when your connection comes back.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
